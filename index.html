<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gacha Machine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5eeff;
      font-family: sans-serif;
    }

    /* ── Machine ── */
    .machine-wrapper {
      position: relative;
      display: inline-block;
    }

    .machine-img {
      width: 280px;
      display: block;
    }

    .knob-img {
      position: absolute;
      width: 64px;
      right: 30px;
      top: 60%;
      transform: translateY(-50%) rotate(0deg);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transform-origin: center center;
      z-index: 1;
    }

    .knob-img.spin {
      animation: knob-spin 0.35s ease-out forwards;
    }

    @keyframes knob-spin {
      0%   { transform: translateY(-50%) rotate(0deg); }
      50%  { transform: translateY(-50%) rotate(60deg); }
      100% { transform: translateY(-50%) rotate(0deg); }
    }

    /* ── Counter & button ── */
    .counter {
      margin-top: 14px;
      font-size: 14px;
      color: #7c3aed;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .pips {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
    }

    .pip {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d8b4fe;
      transition: background 0.2s;
    }

    .pip.filled { background: #7c3aed; }

    .btn-edit {
      margin-top: 18px;
      padding: 10px 28px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-edit:hover { background: #6d28d9; }

    /* ── Edit Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 18px;
      padding: 24px 22px 20px;
      width: min(340px, 92vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .modal h2 {
      font-size: 18px;
      color: #3b0764;
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-row input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid #e0d0ff;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-row input:focus { border-color: #7c3aed; }

    .btn-add {
      padding: 9px 16px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-add:hover { background: #6d28d9; }

    .item-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      min-height: 40px;
    }

    .item-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: #f9f5ff;
      border-radius: 9px;
      margin-bottom: 7px;
      font-size: 14px;
      color: #333;
      word-break: break-word;
    }

    .btn-del {
      background: none;
      border: none;
      color: #c026d3;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .empty-msg {
      text-align: center;
      color: #bbb;
      padding: 18px 0;
      font-size: 14px;
    }

    .btn-close-modal {
      margin-top: 14px;
      padding: 10px;
      width: 100%;
      background: #f3e8ff;
      color: #7c3aed;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-close-modal:hover { background: #ede9fe; }

    /* ── Result overlay ── */
    .result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .result-overlay.open { display: flex; }

    .capsule-wrap {
      position: relative;
      display: inline-block;
      animation: drop-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes drop-in {
      0%   { transform: translateY(-180px); opacity: 0; }
      65%  { transform: translateY(14px);   opacity: 1; }
      100% { transform: translateY(0);      opacity: 1; }
    }

    .capsule-img {
      width: 130px;
      display: block;
    }

    .capsule-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 10px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      line-height: 1.3;
    }

    .btn-again {
      margin-top: 22px;
      padding: 11px 30px;
      background: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #7c3aed;
      cursor: pointer;
    }
    .btn-again:hover { background: #f3e8ff; }
  </style>
</head>
<body>

  <!-- ── Gacha machine ── -->
  <div class="machine-wrapper">
    <img src="gacha_machine.png" alt="Gacha Machine" class="machine-img">
    <img src="knob.png" alt="Knob" class="knob-img" id="knob">
  </div>

  <p class="counter">Turn the knob 3 times!</p>
  <div class="pips" id="pips">
    <div class="pip" id="pip0"></div>
    <div class="pip" id="pip1"></div>
    <div class="pip" id="pip2"></div>
  </div>

  <button class="btn-edit" id="btn-edit">Edit Capsules</button>

  <!-- ── Edit modal ── -->
  <div class="overlay" id="edit-modal">
    <div class="modal">
      <h2>Edit Capsules</h2>
      <div class="input-row">
        <input type="text" id="item-input" placeholder="Enter item name…" maxlength="60">
        <button class="btn-add" id="btn-add">Add</button>
      </div>
      <ul class="item-list" id="item-list"></ul>
      <button class="btn-close-modal" id="btn-close-modal">Done</button>
    </div>
  </div>

  <!-- ── Result overlay ── -->
  <div class="result-overlay" id="result-overlay">
    <div class="capsule-wrap" id="capsule-wrap">
      <img src="capsule.png" alt="Capsule" class="capsule-img">
      <div class="capsule-text" id="result-text"></div>
    </div>
    <button class="btn-again" id="btn-again">Try Again</button>
  </div>

  <script>
    let items = [];
    let clicks = 0;
    const REQUIRED = 3;

    const knob         = document.getElementById('knob');
    const pips         = [0,1,2].map(i => document.getElementById('pip' + i));
    const btnEdit      = document.getElementById('btn-edit');
    const editModal    = document.getElementById('edit-modal');
    const itemInput    = document.getElementById('item-input');
    const btnAdd       = document.getElementById('btn-add');
    const itemList     = document.getElementById('item-list');
    const btnCloseModal= document.getElementById('btn-close-modal');
    const resultOverlay= document.getElementById('result-overlay');
    const capsuleWrap  = document.getElementById('capsule-wrap');
    const resultText   = document.getElementById('result-text');
    const btnAgain     = document.getElementById('btn-again');

    /* ── Pips ── */
    function updatePips() {
      pips.forEach((p, i) => p.classList.toggle('filled', i < clicks));
    }

    /* ── Knob click ── */
    knob.addEventListener('click', () => {
      if (resultOverlay.classList.contains('open')) return;

      // Restart spin animation
      knob.classList.remove('spin');
      void knob.offsetWidth;
      knob.classList.add('spin');

      clicks = Math.min(clicks + 1, REQUIRED);
      updatePips();

      if (clicks === REQUIRED) {
        setTimeout(triggerResult, 400);
      }
    });

    knob.addEventListener('animationend', () => knob.classList.remove('spin'));

    /* ── Result ── */
    function triggerResult() {
      if (items.length === 0) {
        alert('No capsule items yet!\nTap "Edit Capsules" to add some.');
        clicks = 0;
        updatePips();
        return;
      }
      const picked = items[Math.floor(Math.random() * items.length)];
      resultText.textContent = picked;

      // Restart drop animation
      capsuleWrap.style.animation = 'none';
      void capsuleWrap.offsetWidth;
      capsuleWrap.style.animation = '';

      resultOverlay.classList.add('open');
    }

    /* ── Try again ── */
    btnAgain.addEventListener('click', () => {
      resultOverlay.classList.remove('open');
      clicks = 0;
      updatePips();
    });

    /* ── Edit modal ── */
    btnEdit.addEventListener('click', () => {
      renderList();
      editModal.classList.add('open');
      itemInput.focus();
    });

    btnCloseModal.addEventListener('click', () => editModal.classList.remove('open'));

    editModal.addEventListener('click', e => {
      if (e.target === editModal) editModal.classList.remove('open');
    });

    /* ── Add item ── */
    function addItem() {
      const val = itemInput.value.trim();
      if (!val) return;
      items.push(val);
      itemInput.value = '';
      itemInput.focus();
      renderList();
    }

    btnAdd.addEventListener('click', addItem);
    itemInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    /* ── Delete item ── */
    function deleteItem(i) {
      items.splice(i, 1);
      renderList();
    }

    /* ── Render list ── */
    function renderList() {
      if (items.length === 0) {
        itemList.innerHTML = '<li class="empty-msg">No items yet</li>';
        return;
      }
      itemList.innerHTML = items.map((item, i) => `
        <li>
          <span>${escHtml(item)}</span>
          <button class="btn-del" onclick="deleteItem(${i})" title="Remove">×</button>
        </li>
      `).join('');
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Init
    renderList();
    updatePips();
  </script>
</body>
</html>
